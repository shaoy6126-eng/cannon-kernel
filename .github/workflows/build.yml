name: Build cannon kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig (cannon = Note 9 5G)"
        required: true
        default: cannon_user_defconfig
        type: choice
        options:
          - cannon_user_defconfig
          - cannong_user_defconfig
      ksu:
        description: "Integrate KernelSU-Next (true first; if build fails try false)"
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Clean disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xandroid64/kernel_xiaomi_cannon
          ref: android-10
          path: kernel
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev build-essential python3 zip unzip cpio rsync device-tree-compiler

      - name: Download toolchain
        run: |
          set -e
          mkdir -p tc/clang tc/gcc
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902.tar.gz" | tar -xz -C tc/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r48.tar.gz" | tar -xz -C tc/gcc
          tc/clang/bin/clang --version | head -n1
          tc/gcc/bin/aarch64-linux-android-gcc --version | head -n1

      - name: Integrate KernelSU-Next
        if: ${{ inputs.ksu }}
        working-directory: kernel
        run: |
          set -e
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          test -L drivers/kernelsu
          python3 - <<'PY'
          import pathlib, sys

          HOOKS = {
              "fs/exec.c": (
                  "\tif (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);\n",
                  "#ifdef CONFIG_KSU\n\t{\n\t\textern int ksu_handle_execveat(int *, struct filename **, void *, void *, int *);\n\t\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n\t}\n#endif\n",
              ),
              "fs/open.c": (
                  "\tif (mode & ~S_IRWXO)\t/* where's F_OK, X_OK, W_OK, R_OK? */\n",
                  "#ifdef CONFIG_KSU\n\t{\n\t\textern int ksu_handle_faccessat(int *, const char __user **, int *, int *);\n\t\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\t}\n#endif\n",
              ),
              "fs/stat.c": (
                  "\terror = vfs_fstatat(dfd, filename, &stat, flag);\n",
                  "#ifdef CONFIG_KSU\n\t{\n\t\textern int ksu_handle_stat(int *, const char __user **, int *);\n\t\tksu_handle_stat(&dfd, &filename, &flag);\n\t}\n#endif\n",
              ),
          }

          for path, (anchor, insert) in HOOKS.items():
              p = pathlib.Path(path)
              if not p.exists():
                  sys.exit("[FAIL] missing file: " + path)
              s = p.read_text(errors="surrogateescape")
              if "ksu_handle_" in s:
                  print("[skip] already patched: " + path)
                  continue
              if anchor not in s:
                  sys.exit("[FAIL] anchor not found in " + path)
              s = s.replace(anchor, insert + anchor, 1)
              p.write_text(s, errors="surrogateescape")
              print("[ok] patched: " + path)
          PY
          printf '\n# KernelSU\nCONFIG_KSU=y\n' >> "arch/arm64/configs/${{ inputs.defconfig }}"

      - name: Configure
        working-directory: kernel
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- HOSTCFLAGS="-fcommon" KCFLAGS="-fcommon" "${{ inputs.defconfig }}"
          sed -i 's/^CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' out/.config
          ./scripts/config --file out/.config --disable LTO_CLANG || true
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- HOSTCFLAGS="-fcommon" KCFLAGS="-fcommon" olddefconfig
          echo "=== key configs ==="
          grep -E "LTO|^CONFIG_KSU=|^CONFIG_KALLSYMS=|^CONFIG_THREAD_INFO_IN_TASK=" out/.config || true
          if grep -q '^CONFIG_LTO_CLANG=y' out/.config; then echo "ERROR: LTO still enabled"; exit 1; fi

      - name: Build
        working-directory: kernel
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$GITHUB_WORKSPACE/tc/gcc/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- HOSTCFLAGS="-fcommon" KCFLAGS="-fcommon" Image -j"$(nproc)" 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          gzip -9 -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.gz
          ls -l out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz

      - name: Collect artifacts
        if: success()
        working-directory: kernel
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          ls -l out/arch/arm64/boot/
          for f in Image Image.gz Image.gz-dtb; do
            if [ -f "out/arch/arm64/boot/$f" ]; then cp "out/arch/arm64/boot/$f" "$GITHUB_WORKSPACE/artifacts/"; fi
          done
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum * | tee sha256.txt
          du -h *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cannon-kernel-${{ inputs.defconfig }}-ksu${{ inputs.ksu }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
